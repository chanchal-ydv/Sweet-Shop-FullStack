<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Shop Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="authSection">
        <div class="login-card"> 
            <h1 class="login-title">🔐 Sugar Auth</h1>
            <p style="color: #888; margin-bottom: 30px;">Welcome to the sweetest inventory manager.</p>
            
            <form id="authForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <div style="display: flex; gap: 15px; margin-top: 30px; justify-content: center;">
                    <button type="button" class="btn" id="loginBtn">Login</button>
                    <button type="button" class="btn" id="registerBtn" style="background: #4ecdc4; box-shadow: 0 4px 0px #3dbbb2;">Register</button>
                </div>
            </form>
        </div>
    </div>

    <div class="dashboard-container container" id="dashboardSection" style="display: none;">
        
        <div class="hero">
            <div>
                <h1>🍬 Sweet Shop Manager</h1>
                <p class="subtitle">Official Inventory & Sales Dashboard</p>
            </div>
            <button id="logoutBtn" class="btn" style="background:#333; font-size:14px; width:auto;">Logout</button>
        </div>

        <div class="form-section">
            <div class="input-row">
                <h3>Admin Panel:</h3>
                <input type="text" id="addName" placeholder="Sweet Name">
                <input type="number" id="addPrice" placeholder="Price (₹)">
                <input type="number" id="addQty" placeholder="Qty" style="max-width:120px;">
            </div>
            <button class="btn" id="addBtn" style="width: 250px;">+ Add Sweet</button>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search sweets...">
            <select id="sortSelect" class="sort-select">
                <option value="default">Sort By: Newest</option>
                <option value="asc">Price: Low to High</option>
                <option value="desc">Price: High to Low</option>
            </select>
        </div>

        <div class="grid" id="sweetsGrid">
            </div>
        
        <footer>© 2026 Sweet Shop Systems</footer>
    </div>

    <script src="script.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
